name: method_call_refusal
description: >-
  M9-R closure proof: an instance method call on a LOCALLY-CONSTRUCTED (M9-O) project-class receiver
  must refuse as BRG3013, never silently lower to a nonexistent property on the emitted structural
  object. Found as a real silent-wrong-code gap during M9-R's own closure audit — the pre-existing M9-J
  refusal only recognized a bare parameter receiver, never a local one, so an unsupported member call on
  a value constructed in the same build method reached `tsc` as its own, uncontrolled error instead of
  this compiler's own honest diagnostic (docs/m9/m9r-final-closure.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
