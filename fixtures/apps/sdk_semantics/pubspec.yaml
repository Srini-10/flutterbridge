name: sdk_semantics
description: >-
  M11 (ADR-0054): dart:core String and number members, switch statements, increments used as values, `.call`, Future
  `whenComplete`, and null-aware access on a prop. Run by Flutter and as the generated component, compared.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
