name: loop_variables
description: >-
  M9-A fixture: a `for`-loop's own declared variable(s) (ADR-28, amended M9-A) — a for-in loop's own
  loop variable and a C-style loop's own declared variable, each given the same declaration-tier
  identity an ordinary local already has, proving nested loops, same-name shadowing, cross-action
  collisions, and an ordinary local sharing a name all resolve each read to the exact declaration in
  scope at that point, never by name (docs/adr/0028-amendment-for-loop-variable-identity.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
