name: transitive_actions
description: >-
  M8-O fixture: sig.Action bodies that reference other sig.Actions — one-hop, two-hop, three-hop,
  fan-out, a self-cycle, a mutual cycle, a parameterized action, an async action, a write-nothing
  action (M8-H's domain), an action reachable both directly from render and transitively, an
  unreferenced action, and two different owners with an identically-named action — proving
  referencedActions' fixed-point discovery resolves each by NodeId, never by name, and never emits
  an action nothing reaches.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
