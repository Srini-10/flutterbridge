name: int_bit_refusal
description: >-
  M11-I (plan Phase E) negative proof: an int constant expression that divides by zero, shifts by a negative count, or leaves the safe-integer domain is refused at build time (ADR-0050), never emitted as a rounded number.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
