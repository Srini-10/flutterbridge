name: local_variables
description: >-
  M8-N fixture: ordinary local variables in action bodies (ADR-28) — two unrelated actions declaring
  textually identical locals, a local read twice in one expression, a mutable (`var`) local, and lexical
  shadowing at two nesting depths — proving declaration-tier identity resolves each read to the exact
  declaration Dart's own scoping rules pick, never by name
  (docs/adr/0028-declaration-tier-identity-for-locals-and-parameters.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
