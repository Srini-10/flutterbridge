name: m9_class_closure
description: >-
  M9-R final closure fixture — one integrated proof of the complete bounded project-class subset M9
  closes with: a required-named structural constructor (M9-P), an immutable field read (M9-N), and a
  bounded derived getter (M9-Q), all on one class, exercised across two files. Deliberately carries no
  method call — methods remain refused, deferred to M10+ (docs/m9/m9r-final-closure.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
