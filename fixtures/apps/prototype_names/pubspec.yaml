name: prototype_names
description: >-
  M14 (ADR-0076): identifiers that are also members of JavaScript's Object.prototype — constructor, toString, valueOf, hasOwnProperty, prototype, __proto__,
  length — as State fields, parameters, locals, methods, enum values and map keys. Compared with Flutter; a generator that indexes a table with a name crashes.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
