name: async_push_guard
description: >-
  M7-H fixture: hello_bridge's own shape, reduced to a clean tsc build — an async, awaited
  Navigator.push reached only after an await and a `mounted` guard, carrying constant, promotable
  signal, and promotable action arguments to its destination
  (docs/m7/m7h-async-navigation-extraction.md). Proves the analyzer's async/await/mounted
  navigation lowering and the generator's action-referenced router declaration feed M7-F/M7-G's
  existing mechanisms rather than bypassing them.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
