name: m11f_callback_parameter_identity
description: >-
  M11-F positive proof: a real, cataloged, statement-bodied, PARAMETERIZED callback
  (`Checkbox.onChanged: (value) { ... }`) reads its own parameter correctly, whether directly or from
  a nested `setState` closure — never `BRG3006`, and (the point of this fixture) never colliding with
  a differently-named captured local or a store action's own differently-named parameter. A parameter
  SHADOWED by a same-named local declared inside a nested/spliced-open closure is a SEPARATE,
  deliberately refused shape — see `fixtures/apps/m11f_callback_parameter_collision`.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
