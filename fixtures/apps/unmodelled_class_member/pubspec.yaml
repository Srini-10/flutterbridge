name: unmodelled_class_member
description: >-
  M9-J fixture: an honest capability refusal for member access on a project-defined class receiver this
  generator has no member model for — field reads, getter reads, method calls, nested access, same-name
  classes, and an inherited/overridden getter, all refused as BRG3013 before generation, never silently
  lowered to a TypeScript `unknown` receiver (docs/m9/m9j-unsupported-project-class-member-refusal.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
