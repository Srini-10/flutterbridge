name: structural_class_construction
description: >-
  M9-O fixture: a bounded, structural project-class construction — `Model(7, 'A')` lowers to a plain
  JS object literal (`{ count: 7, name: 'A' }`), never a runtime class, never a constructor call — with
  argument-evaluation order preserved even when it differs from field-declaration order
  (docs/m9/m9o-bounded-structural-project-class-construction.md).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
