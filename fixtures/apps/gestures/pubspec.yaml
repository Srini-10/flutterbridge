name: gestures
description: >-
  M13 (ADR-0070): GestureDetector and InkWell — tap, double tap, long press, tap down/up/cancel, hover, focus,
  keyboard activation, the disabled state and nesting. Run by Flutter and as the generated component, compared.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
