name: class_model
description: >-
  M12 (ADR-0055): project classes as real classes — fields, constructors (named, initializer lists, factory, redirecting),
  methods, getters, operators, inheritance, abstract classes, statics, `is`. Run by Flutter and as the generated
  component, compared.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
