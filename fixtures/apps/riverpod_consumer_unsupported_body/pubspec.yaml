name: riverpod_consumer_unsupported_body
description: >-
  M14 fixture (negative, paired with `riverpod_consumer`/`riverpod_builder_body_locals`): the two ways a real
  `Consumer(builder: ...)` site still fails today, each with its own precise diagnostic, neither silent.
  `BlockBody` is App B's `if`-deciding-the-return shape (`final resolved = ref.watch(...).valueOrNull; if
  (resolved == null) return const SizedBox.shrink(); return AppPrice(...);` — 2 of its 5 real sites, the other
  3 being one leading local and one `return`, which is supported): control flow deciding the return, which a
  `ui.*` node has no representation for (`_bindLeadingLocalsAndReturn` refuses it, `BRG3004`, "builder body
  with statements"). `ItemTemplate` is `search_page.dart`'s own `_Results` shape: a `Consumer` reached only
  from inside a `GridView.builder`'s own `itemBuilder` — a position a hook cannot run from unconditionally,
  refused by `component.ts`'s own `declareRiverpodWatches` (ADR-0048), proven here with an expression-bodied
  builder so it is *this* refusal being exercised, not the other one.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1

flutter:
  uses-material-design: true
