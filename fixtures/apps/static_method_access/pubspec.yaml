name: static_method_access
description: >-
  M11-A positive proof: a call to a project-defined class's own STATIC method (`Model.compute(3)`) — no
  receiver at all — resolves a real target and lowers to a real, callable, module-level TypeScript
  function. Static fields/consts and static getters remain out of scope (a separate, pre-existing M8-P
  boundary and a natural, narrower follow-on respectively — refused honestly, unchanged).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
