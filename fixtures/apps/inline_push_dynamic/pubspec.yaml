name: inline_push_dynamic
description: >-
  M14 fixture: an inline Navigator.push whose arguments are computed where the push happens — the caller's own
  constructor parameter, a local, a property of a local object, a live object, a widget and a closure that writes the
  caller's state. Nothing here is a constant, and none of it can be a URL. The destination is a stack entry the runtime
  hands values to (ADR-0077).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
