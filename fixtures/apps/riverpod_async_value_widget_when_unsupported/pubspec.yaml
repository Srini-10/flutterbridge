name: riverpod_async_value_widget_when_unsupported
description: >-
  M14 fixture (negative, paired with `riverpod_async_value_widget_position`): App B's own *dominant* real
  shape for `.when(...)` in widget position is not a bare expression — most branches read through a `final`
  local or perform a side effect first (`error: (e, _) { debugPrint('...: $e'); return AppEmptyState(...); }`
  is a real, representative shape — `docs/m14/riverpod-usage-matrix.md` §4j). `widget_extractor.dart`'s own
  `_asyncValueWhen` extracts each branch through the same `_widgetOfBody` a `FutureBuilder`'s own `data`
  branch already goes through, which only inlines a block of *exactly one* statement (a bare `return`) —
  the identical, pre-existing, general "builder body with statements" limitation named throughout this
  milestone (§4d, §4f), not something this phase introduces or is scoped to close. Confirmed directly: this
  reaches the generator as a *precise*, narrow refusal on the one affected branch (`BRG3004`, "builder body
  with statements") — not the wide "widget returned by a call" the whole `.when(...)` call used to be opaque
  as, and not a silent drop of the branches that *are* simple.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1

flutter:
  uses-material-design: true
