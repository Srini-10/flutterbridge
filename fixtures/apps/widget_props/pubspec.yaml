name: widget_props
description: >-
  M14 (ADR-0074): widgets and lists of widgets passed to a project widget as named parameters — several per call, nullable, with conditional and spread
  elements — compared with Flutter. A project widget's parameters are its own, by name.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
