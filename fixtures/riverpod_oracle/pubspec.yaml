name: riverpod_oracle
description: >-
  M14: records what the real `riverpod` package does in a set of scenarios, as `expected.json`. The generated runtime's
  ProviderContainer (packages/runtimes/react) is replayed against the same scenarios and compared.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  riverpod: 2.6.1
